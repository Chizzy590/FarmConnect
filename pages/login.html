<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmConnect Login</title>

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/auth.js" defer></script>
</head>

<body>

    <div class="auth-container">

        <!-- Left Side -->

        <div class="image-side">

            <img src="../images/login-Image.png" alt="Farm Image">

        </div>

        <!-- Right Side -->

        <div class="form-side">

            <div class="top-nav">

                <a href="../index.html" class="logo">
                    <img src="../icons/Leaf.png" alt="leaf-logo" class="logo-icon">
                    FarmConnect
                </a>

                <div class="login-link">

                    <span>Already have an account?</span>

                    <a href="signup.html" class="btn btn-green">
                        Sign up
                    </a>

                </div>

            </div>
            <div class="auth-content">

                <div class="auth-card">

                    <div class="avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <h1 class="text">Create an account</h1>


                    <form>

                        <div class="form-group">
                            <label>Email</label>
                            <input type="email">
                        </div>

                        <div class="form-group">

                            <div class="password-header">
                                <label for="password">Password</label>

                                <span class="hide-password" id="togglePassword">
                                    <i class="fa-solid fa-eye-slash"></i>
                                    Hide
                                </span>
                            </div>

                            <input type="password" id="password">

                        </div>

                        <div class="form-group">

                            <label class="checkbox-label">
                                <input type="checkbox">
                                By creating an account, I agree to our Terms of use and Privacy Policy
                            </label>

                        </div>

                        <button class="btn btn-green login-btn">
                            Log in
                        </button>
                        <div class="divider">
                            <span>OR</span>
                        </div>

                        <button type="button" class="social-btn">
                            <img src="../icons/Google-Logo.png" alt="Google" class="social-icon">
                            Continue with Google
                        </button>

                        <button type="button" class="social-btn">
                            <img src="../icons/Apple-logo.png" alt="Apple" class="social-icon">
                            Continue with Apple
                        </button>
                    </form>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
