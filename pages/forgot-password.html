<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmConnect - Forgot Password</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <section class="reset-password">

    <div class="reset-content">

        <h1>Password Reset</h1>

        <p class="reset-text">
            Password reset link will be sent to your email address,
            <br>
            know your password?
            <a href="signup.html">Register here</a>
        </p>
 
        <div class="reset-card">

            <form>

                <input
                    type="email"
                    placeholder="Email"
                >

                <button
                    type="submit"
                    class="btn btn-green btn-full reset-btn">

                    Reset Password

                </button>

            </form>

        </div>

    </div>

</section>
</body>
</html>
