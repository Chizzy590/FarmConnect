<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmConnect Checkout</title>
    <link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
     <header>
        <nav class="navbar container">
              <!-- Logo -->
    <a href="index.html" class="logo">
        <img src="../images/logo/Horizontal Logo Gree.png" alt="Horizontal Logo Gree">
    </a>

    <!-- Navigation Links -->
    <ul class="nav-links">

        <li><a href="#home" class="active">Home</a></li>
        <li><a href="#about">About Us</a></li>
        <li><a href="#how-it-works">How It Works</a></li>
        <li><a href="#packages">Packages</a></li>
        <li><a href="#contact">Contact</a></li>

    </ul>

    <!-- Get Started Button -->
    <a href="pages/signup.html" class="btn btn-green">
        Get Started
    </a>

    <!-- Mobile Menu -->
    <div class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
    </div>

</nav>
    </header>
   <main>
    <section id="checkout-page">

<div class="container">

<div class="breadcrumb">
<a href="../index.html">Home</a>
<span>»</span>
<a href="cart.html">Cart</a>
<span>»</span>
<span>Checkout</span>
</div>

<div class="checkout-grid">

<!-- LEFT SIDE -->
<div class="checkout-left">

<!-- PERSONAL DETAILS -->
<div class="checkout-card">

<div class="card-title">
<span class="step-circle">1</span>
<h2>Personal Details</h2>
</div>

<div class="form-group">
<input type="text" id="fullName" placeholder="Your Full Name">
</div>

<div class="form-row">

<input type="email" id="email" placeholder="Email">

<input type="text" id="phone" placeholder="Phone Number">
</div>

</div>

<!-- DELIVERY -->

<div class="checkout-card">

<div class="card-title">

<span class="step-circle">2</span>

<h2>Delivery Details</h2>

</div>

<div class="form-row">

<input type="text" id="address" placeholder="Address">

<input type="text" id="city" placeholder="City">

</div>

<div class="form-row">

<input type="text" id="state" placeholder="State">

<input type="text" id="country" placeholder="Country">
</div>

</div>

<!-- PAYMENT -->

<div class="checkout-card">

<div class="card-title">

<span class="step-circle">3</span>

<h2>Payment Method</h2>

</div>

<div class="payment-options">

    <label>
        <input type="radio" name="payment" value="online" checked>
        <span>Pay Online</span>
    </label>

    <label>
        <input type="radio" name="payment" value="delivery">
        <span>Pay On Delivery</span>
    </label>

</div>

<input type="text" placeholder="Name On Card">

<input type="text" placeholder="Card Number">

<div class="form-row">

<input type="text" placeholder="EXP">

<input type="text" placeholder="CCV">

</div>

</div>

</div>

<!-- RIGHT SIDE -->

<div class="checkout-right">

<div class="summary-card">

<h2>Item(s)</h2>

<div class="summary-item">

<img src="../images/company png/maize.jpg">

<div>

<h4>Maize</h4>

<p>₦2,000</p>

</div>

<span>1</span>

</div>

<div class="summary-item">

<img src="../images/company png/rice...jpg">

<div>

<h4>Rice</h4>

<p>₦90,000</p>

</div>

<span>1</span>

</div>

<hr>

<p>Subtotal <span>₦92,000</span></p>

<p>Discount <span>₦0</span></p>

<p>Delivery Fee <span>₦0</span></p>

<p>VAT <span>₦20</span></p>

<h3>Total <span>₦92,020</span></h3>

</div>

<button class="btn btn-green pay-btn" id="payBtn">
    Pay Now
</button>

</div>

</div>

</div>

</section>

   </main>
   <script src="../js/script.js"></script>

</body>
</html>
